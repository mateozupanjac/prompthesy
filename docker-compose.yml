services:
  postgres:
    image: postgres:16-alpine
    container_name: prompthesy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: prompthesy
      POSTGRES_PASSWORD: prompthesy
      POSTGRES_DB: prompthesy
    ports:
      # 5433 to avoid clashing with other local Postgres instances on 5432
      - "5433:5432"
    volumes:
      - prompthesy-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prompthesy -d prompthesy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  prompthesy-postgres-data:
